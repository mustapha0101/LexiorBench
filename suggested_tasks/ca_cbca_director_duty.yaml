answer_detail: "Manquement au devoir de loyauté / Manquement au devoir de diligence / Conflit d'intérêts / Aucun manquement"
jurisdiction: federal_ca
purpose: >
  Déterminer si le comportement d'un administrateur d'une société par actions
  fédérale constitue un manquement à son devoir de loyauté, à son devoir de
  diligence, ou un conflit d'intérêts non divulgué selon la LCSA (LRSC 1985 c C-44).
