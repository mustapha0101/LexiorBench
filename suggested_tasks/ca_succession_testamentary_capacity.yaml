  - "CCQ art. 758-762 — nullité du testament"
  - "CCQ art. 630 — indignité successorale"
notes: >
  Gap: learned_hands_estates covers issue spotting but no CCQ-specific
  testamentary capacity analysis task. 3-class: établie / douteuse / absente.
  High practical value — succession disputes common in Quebec notarial practice.
