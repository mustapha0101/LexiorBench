answer_detail: "Capacité testamentaire établie / Douteuse / Absente"
jurisdiction: quebec
purpose: >
  Évaluer si le testateur avait la capacité testamentaire requise au moment
  de la rédaction du testament (art. 710-730 CCQ) et si le testament risque
  d'être annulé pour incapacité ou vice du consentement.
