[project]
name = "lexior-bench"
version = "0.1.0"
description = "Lexior Bench - LLM evaluation benchmark for Quebec law (banc d'essai pour le droit québécois)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Intelliwork" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "httpx>=0.27",
    "argilla>=2.4",
    "label-studio-sdk>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
hf = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
lexior-bench = "lexior_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexior_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
